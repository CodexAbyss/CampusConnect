<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="top">
        <nav class="nav">
            <h2>CampusConnect</h2>
            <div class="links">
                <a href="index.html">Home</a>
                <a href="events.html">Events</a>
                <a href="register.html">Register</a>
            </div>
        </nav>
    </header>

    <main class="section page-area">
        <p class="small-title">SAVE YOUR SPOT</p>
        <h1>Event Registration</h1>
        <p class="muted">Fill in your details to register for a campus event.</p>

        <div class="form-box">
            <form id="registrationForm">
                <label for="studentName">Full name</label>
                <input type="text" id="studentName" placeholder="Enter your name">

                <label for="studentEmail">College email</label>
                <input type="email" id="studentEmail" placeholder="name@example.com">

                <label for="studentRoll">Roll number</label>
                <input type="text" id="studentRoll" placeholder="Enter your roll number">

                <label for="eventChoice">Choose event</label>
                <select id="eventChoice">
                    <option value="">Select an event</option>
                    <option value="Code Sprint">Code Sprint</option>
                    <option value="Campus Beats">Campus Beats</option>
                    <option value="Sports Day">Sports Day</option>
                </select>

                <button type="submit" class="btn">Submit Registration</button>
                <button type="button" class="btn second" id="changeFontSizeBtn">Change Text Size</button>
                <button type="button" class="btn second" id="toggleFormBtn">Hide Form</button>
                <p id="formMessage" class="message"></p>
            </form>
        </div>
    </main>

    <footer><p>CampusConnect · Made for students</p></footer>
</body>
</html>
